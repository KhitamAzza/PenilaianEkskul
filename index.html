<!DOCTYPE html>

<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>Penilaian Ekstrakurikuler</title>

<style>

body{
  font-family:system-ui;
  margin:0;
  background:#f1f3f6;
}

header{
  background:#574303;
  color:white;
  padding:14px;
  text-align:center;
  font-weight:600;
}

#topbar{
  padding:10px;
  background:white;
  position:sticky;
  top:0;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}

select{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
}

#students{
  padding:10px;
}

.card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin:10px 0;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nama{
  font-weight:600;
  font-size:16px;
}

.kelas{
  font-size:13px;
  color:#666;
}

.nilai{
  width:80px;
  font-size:18px;
  text-align:center;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

.nilai:focus{
  border:2px solid #574303;
  outline:none;
}

#save{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:14px;
  border:none;
  font-size:18px;
  color:white;
  background:#9aa0a6;
}

#save.active{
  background:#574303;
}
#loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loaderBox{
  background:white;
  padding:20px 26px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #e0e3ea;
  border-top:4px solid #574303;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.text{
  font-size:15px;
  font-weight:600;
  color:#333;
}

</style>

</head>

<body>

<header>Input Nilai Ekstra</header>

<div id="topbar">
  <select id="ekstraSelect">
    <option value="">Pilih Ekstra...</option>
  </select>
</div>

<div id="students"></div>

<button id="save">Simpan Nilai</button>
<div id="loading">
  <div class="loaderBox">
    <div class="spinner"></div>
    <div class="text">Mengirim nilai...</div>
  </div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycby2yGsVGfEp5A0c6wHZSKawHqifALCSVWUtEtnoeIyiPLrnj7-GDHnEqJu2qE4fMzXh/exec";

let allData=[];
let filtered=[];

// LOAD DATA
async function init(){
  const res=await fetch(API);
  allData=await res.json();

  const ekstraSet=new Set(allData.map(s=>s.ekstra));

  const select=document.getElementById("ekstraSelect");
  ekstraSet.forEach(e=>{
    const opt=document.createElement("option");
    opt.value=e;
    opt.textContent=e;
    select.appendChild(opt);
  });
}

document.getElementById("ekstraSelect").onchange=()=>{
  const val=ekstraSelect.value;
  filtered=allData.filter(s=>s.ekstra===val);
  renderStudents();
};

function renderStudents(){

  const container=document.getElementById("students");
  container.innerHTML="";

  filtered.forEach((s,i)=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div class="row">
        <div>
          <div class="nama">${s.nama}</div>
          <div class="kelas">${s.kelas}</div>
        </div>
        <input type="number" min="0" max="100" class="nilai" data-i="${i}">
      </div>
    `;

    container.appendChild(div);
  });

  attachAutoNext();
}

// AUTO MOVE
function attachAutoNext(){

  const inputs=document.querySelectorAll(".nilai");

  inputs.forEach((input,index)=>{

    input.oninput=()=>{
      checkComplete();

      const val=input.value;
      if(val>=0 && val<=100 && val.length>=2){
        if(inputs[index+1]) inputs[index+1].focus();
      }
    };

  });
}
function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

// SAVE BUTTON STATE
function checkComplete(){
  const inputs=document.querySelectorAll(".nilai");
  const filled=[...inputs].every(i=>i.value!=="");

  const btn=document.getElementById("save");
  if(filled) btn.classList.add("active");
  else btn.classList.remove("active");
}

// SAVE ALL
document.getElementById("save").onclick=async()=>{

  const btn=document.getElementById("save");
  if(!btn.classList.contains("active")) return;

  showLoading();   // <<< LOCK SCREEN

  const inputs=document.querySelectorAll(".nilai");

  const payload=filtered.map((s,i)=>({
    nama:s.nama,
    nilai:inputs[i].value
  }));

  try{

    const res=await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload)
    });

    const r=await res.json();

    hideLoading();
    alert(r.message || "Nilai berhasil disimpan");

  }catch(err){

    hideLoading();
    alert("Koneksi ke server gagal");
  }
};

init();

</script>

</body>
</html>
