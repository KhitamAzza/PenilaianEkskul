<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>Penilaian Ekstrakurikuler</title>

<style>
body{
  font-family:system-ui;
  margin:0;
  background:#f1f3f6;
}

header{
  background:#574303;
  color:white;
  padding:14px;
  text-align:center;
  font-weight:600;
}

#topbar{
  padding:10px;
  background:white;
  position:sticky;
  top:0;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}

select{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
}

#students{
  padding:10px;
  padding-bottom:80px; /* Space for fixed button */
}

.card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin:10px 0;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nama{
  font-weight:600;
  font-size:16px;
}

.kelas{
  font-size:13px;
  color:#666;
}

.nilai{
  width:80px;
  font-size:18px;
  text-align:center;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

.nilai:focus{
  border:2px solid #574303;
  outline:none;
}

/* Status indicators */
.nilai.filled{
  background:#e8f5e9;
  border-color:#4caf50;
}

.nilai.empty{
  background:#fff3e0;
  border-color:#ff9800;
}

#save{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:14px;
  border:none;
  font-size:18px;
  color:white;
  background:#574303; /* Always active color */
  cursor:pointer;
}

#save:active{
  background:#3d2f02;
}

#loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loaderBox{
  background:white;
  padding:20px 26px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #e0e3ea;
  border-top:4px solid #574303;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.text{
  font-size:15px;
  font-weight:600;
  color:#333;
}

/* Stats bar */
#stats{
  padding:10px;
  background:#fff;
  margin:10px;
  border-radius:10px;
  font-size:14px;
  color:#666;
  display:none;
}
</style>

</head>

<body>

<header>Input Nilai Ekstra</header>

<div id="topbar">
  <select id="ekstraSelect">
    <option value="">Pilih Ekstra...</option>
  </select>
</div>

<div id="stats"></div>

<div id="students"></div>

<button id="save">Simpan Nilai</button>

<div id="loading">
  <div class="loaderBox">
    <div class="spinner"></div>
    <div class="text" id="loadingText">Memuat data...</div>
  </div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycby2yGsVGfEp5A0c6wHZSKawHqifALCSVWUtEtnoeIyiPLrnj7-GDHnEqJu2qE4fMzXh/exec";

let allData=[];
let filtered=[];

// SHOW LOADING with custom text
function showLoading(text){
  document.getElementById("loadingText").textContent = text || "Memuat...";
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

// LOAD DATA
async function init(){
  showLoading("Memuat data siswa..."); // << CHANGED: Loading text for initial load
  try {
    const res=await fetch(API);
    allData=await res.json();

    const ekstraSet=new Set(allData.map(s=>s.ekstra));

    const select=document.getElementById("ekstraSelect");
    ekstraSet.forEach(e=>{
      const opt=document.createElement("option");
      opt.value=e;
      opt.textContent=e;
      select.appendChild(opt);
    });
  } catch(err) {
    alert("Gagal memuat data dari server");
  } finally {
    hideLoading();
  }
}

document.getElementById("ekstraSelect").onchange=()=>{
  const val=ekstraSelect.value;
  filtered=allData.filter(s=>s.ekstra===val);
  renderStudents();
  updateStats();
};

function renderStudents(){
  const container=document.getElementById("students");
  container.innerHTML="";

  if(filtered.length === 0){
    container.innerHTML='<div style="text-align:center;padding:40px;color:#999;">Pilih ekstrakurikuler terlebih dahulu</div>';
    document.getElementById("stats").style.display = "none";
    return;
  }

  filtered.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="card";

    // Check if nilai exists and is not empty/null/undefined
    const existingNilai = s.nilai !== undefined && s.nilai !== null && s.nilai !== "" ? s.nilai : "";
    const isFilled = existingNilai !== "";

    div.innerHTML=`
      <div class="row">
        <div>
          <div class="nama">${s.nama}</div>
          <div class="kelas">${s.kelas}</div>
        </div>
        <input type="number" min="0" max="100" class="nilai ${isFilled ? 'filled' : 'empty'}" 
               data-i="${i}" value="${existingNilai}" placeholder="-">
      </div>
    `;

    container.appendChild(div);
  });

  attachAutoNext();
  updateStats();
}

// Update statistics
function updateStats(){
  const inputs = document.querySelectorAll(".nilai");
  if(inputs.length === 0) return;
  
  const filled = [...inputs].filter(i => i.value !== "").length;
  const total = inputs.length;
  
  const statsDiv = document.getElementById("stats");
  statsDiv.style.display = "block";
  statsDiv.innerHTML = `Sudah dinilai: <strong>${filled}</strong> dari <strong>${total}</strong> siswa`;
}

// AUTO MOVE
function attachAutoNext(){
  const inputs=document.querySelectorAll(".nilai");

  inputs.forEach((input,index)=>{
    input.oninput=()=>{
      // Update visual status
      if(input.value !== ""){
        input.classList.remove("empty");
        input.classList.add("filled");
      } else {
        input.classList.remove("filled");
        input.classList.add("empty");
      }
      updateStats();

      // Auto next when 2 digits entered
      const val=input.value;
      if(val>=0 && val<=100 && val.length>=2){
        if(inputs[index+1]) inputs[index+1].focus();
      }
    };
    
    // Also update on blur (when leaving field)
    input.onblur = () => {
      updateStats();
    };
  });
}

// SAVE ALL - Now always active, allows partial saves
document.getElementById("save").onclick=async()=>{
  
  showLoading("Menyimpan nilai..."); // << CHANGED: Different text for saving

  const inputs=document.querySelectorAll(".nilai");

  // Send all data, including empty values (as null or empty string)
  const payload=filtered.map((s,i)=>({
    nama:s.nama,
    kelas:s.kelas,
    ekstra:s.ekstra,
    nilai:inputs[i].value === "" ? null : parseInt(inputs[i].value)
  }));

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload)
    });

    const r=await res.json();

    hideLoading();
    
    // Update local data with saved values
    filtered.forEach((s,i)=>{
      s.nilai = inputs[i].value;
    });
    
    alert(r.message || `Nilai berhasil disimpan! ${payload.filter(p => p.nilai !== null).length} data tersimpan.`);

  }catch(err){
    hideLoading();
    alert("Koneksi ke server gagal: " + err.message);
  }
};

init();

</script>

</body>
</html>
